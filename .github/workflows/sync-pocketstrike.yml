name: Replace Yoho with PocketStrike-AI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yoho
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository contents
        run: |
          set -e
          rm -rf /tmp/PocketStrike-AI
          git clone --depth 1 https://github.com/AbuZar-Ansarii/PocketStrike-AI.git /tmp/PocketStrike-AI
          rm -rf /tmp/PocketStrike-AI/.git

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/PocketStrike-AI/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Replace Yoho with PocketStrike-AI"
            git push origin HEAD:main
          fi
